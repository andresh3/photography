    body {
      margin: 0;
      background: #111;

      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 1200px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px;
      background: #202020;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 1.25rem;
      font-weight: normal;
    }

    .photos {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .photo {
      flex: 0 0 100%;
      min-width: 0;
      margin: 0;
    }

    .photo a {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 3 / 2;
      background: #171717;
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .photo figcaption {
      margin-top: 8px;
      color: #aaa;
      font-size: 0.75rem;
      text-align: center;
    }

    @media (min-width: 600px) {
      .photo {
        flex-basis: calc((100% - 16px) / 2);
      }
    }

    @media (min-width: 800px) {
      .photo {
        flex-basis: calc((100% - 32px) / 3);
      }
    }

    @media (min-width: 1100px) {
      .photo {
        flex-basis: calc((100% - 80px) / 6);
      }
    }
  </style>
</head>
